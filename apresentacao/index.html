<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OWASP Juice Shop, Avaliação de Vulnerabilidades — Seminário</title>
<meta name="description" content="Seminário da Entrega 2: avaliação de sete vulnerabilidades do OWASP Juice Shop, classificação OWASP Top 10, CWE e CVSS." />
<style>
:root{
  --apm-bg:#03152D; --apm-surface:#0A1324; --apm-surface-2:#0F1B33;
  --apm-fg:#FEFEFE; --apm-fg-2:#EAF3F7; --apm-muted:#8FA3BE;
  --apm-turquoise:#2DD4BE; --apm-turquoise-2:#41D7C3;
  --apm-orange:#F59D0A; --apm-violet:#A68BFA; --apm-pink:#F472B5;
  --apm-teal-dark:#0E5C59;
  --apm-border:rgba(45,212,190,.18); --apm-border-strong:rgba(45,212,190,.42);
  --apm-danger:#ef4444; --apm-red:#f87171; --apm-green:#34d399;
  --apm-font:"Segoe UI",Inter,Arial,sans-serif;
  --apm-mono:"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--apm-bg); color:var(--apm-fg);
  font-family:var(--apm-font); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
a{color:var(--apm-turquoise);text-decoration:none}
a:hover{color:var(--apm-turquoise-2)}

/* ---------- Topbar ---------- */
.apm-topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:rgba(3,21,45,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--apm-border);
}
.apm-topbtn{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  background:var(--apm-surface);color:var(--apm-fg-2);
  border:1px solid var(--apm-border);border-radius:9px;
  padding:7px 12px;font-size:13px;transition:border-color .2s,background .2s;
}
.apm-topbtn:hover{border-color:var(--apm-border-strong);background:var(--apm-surface-2)}
.apm-brand{font-weight:600;font-size:14px;color:var(--apm-turquoise);white-space:nowrap}
.apm-brand small{color:var(--apm-muted);font-weight:400;margin-left:6px}
.apm-topbar-title{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:13px;color:var(--apm-muted);text-align:right;
}

/* ---------- Sidebar ---------- */
.apm-backdrop{
  position:fixed;inset:0;z-index:40;background:rgba(1,8,20,.6);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.apm-backdrop.open{opacity:1;pointer-events:auto}
.apm-sidebar{
  position:fixed;top:0;left:0;bottom:0;z-index:50;width:320px;max-width:86vw;
  background:var(--apm-surface);border-right:1px solid var(--apm-border);
  transform:translateX(-100%);transition:transform .25s ease;
  display:flex;flex-direction:column;
}
.apm-sidebar.open{transform:translateX(0)}
.apm-sidebar-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid var(--apm-border);
}
.apm-sidebar-head h2{margin:0;font-size:14px;color:var(--apm-turquoise);letter-spacing:.04em}
.apm-sidebar-body{overflow-y:auto;padding:10px 12px 24px}
.apm-group-label{
  font-size:11px;text-transform:uppercase;letter-spacing:.14em;
  color:var(--apm-muted);margin:16px 8px 6px;
}
.apm-toc-item{
  display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:1px solid transparent;border-radius:8px;
  padding:8px 10px;color:var(--apm-fg-2);font-size:13.5px;transition:background .15s,border-color .15s;
}
.apm-toc-item:hover{background:var(--apm-surface-2);border-color:var(--apm-border)}
.apm-toc-item.active{background:var(--apm-surface-2);border-color:var(--apm-border-strong);color:var(--apm-fg)}
.apm-toc-num{font-variant-numeric:tabular-nums;color:var(--apm-turquoise);font-size:12px;min-width:20px}

/* ---------- Nav arrows ---------- */
.apm-nav-arrow{
  position:fixed;top:50%;transform:translateY(-50%);z-index:25;
  width:44px;height:44px;border-radius:50%;cursor:pointer;
  background:var(--apm-surface);border:1px solid var(--apm-border);
  color:var(--apm-fg);font-size:20px;opacity:.6;transition:opacity .2s,border-color .2s;
  display:flex;align-items:center;justify-content:center;
}
.apm-nav-arrow:hover{opacity:1;border-color:var(--apm-border-strong)}
.apm-nav-arrow:disabled{opacity:.15;cursor:default}
.apm-nav-arrow.prev{left:14px}
.apm-nav-arrow.next{right:14px}

/* ---------- Slide shell ---------- */
.apm-shell{min-height:calc(100vh - 97px);display:flex;flex-direction:column}
.apm-stage{flex:1;display:flex}
.apm-slide{
  width:100%;max-width:1400px;margin:0 auto;padding:44px 72px 28px;animation:fade .25s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.apm-eyebrow{
  font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--apm-turquoise);
  margin:0 0 10px;font-weight:600;
}
.apm-slide h1.title{font-size:44px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;line-height:1.1}
.apm-slide h2.subtitle{font-size:18px;color:var(--apm-muted);font-weight:400;margin:0 0 30px}
.apm-slide h3{font-size:20px;margin:26px 0 10px;color:var(--apm-fg)}
.apm-lead{font-size:16px;color:var(--apm-fg-2);max-width:70ch}
.apm-p{font-size:15px;color:var(--apm-fg-2);max-width:72ch;margin:0 0 12px}
.apm-muted{color:var(--apm-muted)}

/* ---------- Cards & grids ---------- */
.apm-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.apm-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.apm-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.apm-card{
  background:var(--apm-surface);border:1px solid var(--apm-border);border-radius:12px;padding:20px;
  transition:border-color .2s,transform .2s;
}
.apm-card.clickable{cursor:pointer}
.apm-card.clickable:hover{border-color:var(--apm-border-strong);transform:translateY(-2px)}
.apm-card h4{margin:0 0 8px;font-size:15px;color:var(--apm-fg)}
.apm-card p{margin:0;font-size:13.5px;color:var(--apm-muted)}

/* ---------- Chips ---------- */
.apm-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;
  background:var(--apm-surface-2);border:1px solid var(--apm-border);border-radius:999px;
  padding:3px 10px;color:var(--apm-fg-2);
}
.apm-chip.turquoise{color:var(--apm-turquoise);border-color:var(--apm-border-strong)}
.apm-chip.orange{color:var(--apm-orange);border-color:rgba(245,157,10,.4)}
.apm-chip.violet{color:var(--apm-violet);border-color:rgba(166,139,250,.4)}
.apm-chip.pink{color:var(--apm-pink);border-color:rgba(244,114,181,.4)}
.apm-chip.red{color:var(--apm-red);border-color:rgba(248,113,113,.45)}

/* ---------- Severity badge ---------- */
.apm-sev{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.apm-sev-dot{width:10px;height:10px;border-radius:50%}
.sev-crit{color:#fda4af}.sev-crit .apm-sev-dot{background:#fb7185}
.sev-high{color:#fbbf9d}.sev-high .apm-sev-dot{background:var(--apm-orange)}
.sev-med{color:#fde68a}.sev-med .apm-sev-dot{background:#facc15}

/* ---------- Metrics ---------- */
.apm-metric{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--apm-turquoise)}
.apm-metric-label{font-size:12.5px;color:var(--apm-muted);margin-top:6px}

/* ---------- Code ---------- */
.apm-code{
  font-family:var(--apm-mono);font-size:13px;background:var(--apm-surface-2);
  border:1px solid var(--apm-border);border-radius:10px;padding:14px 16px;color:var(--apm-fg-2);
  overflow-x:auto;white-space:pre;margin:12px 0;
}
code.apm-inline{
  font-family:var(--apm-mono);font-size:.9em;background:var(--apm-surface-2);
  border:1px solid var(--apm-border);border-radius:6px;padding:1px 6px;color:var(--apm-turquoise-2);
}

/* ---------- Table ---------- */
.apm-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.apm-table th{
  text-align:left;background:var(--apm-surface-2);color:var(--apm-fg);font-weight:600;
  padding:10px 12px;border-bottom:1px solid var(--apm-border-strong);
}
.apm-table td{padding:9px 12px;border-bottom:1px solid var(--apm-border);color:var(--apm-fg-2);vertical-align:top}
.apm-table tr:hover td{background:rgba(15,27,51,.5)}
.apm-table .mono{font-family:var(--apm-mono);font-size:12.5px}

/* ---------- Figure & lightbox ---------- */
.apm-figrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.apm-figure{
  display:flex;flex-direction:column;gap:6px;cursor:zoom-in;background:var(--apm-surface);
  border:1px solid var(--apm-border);border-radius:12px;padding:10px;transition:border-color .2s,transform .2s;
  flex:1;min-width:240px;
}
.apm-figure:hover{border-color:var(--apm-border-strong);transform:translateY(-2px)}
.apm-figure img{width:100%;height:auto;border-radius:7px;display:block;background:#fff}
.apm-figcap{font-size:12px;color:var(--apm-muted)}
.apm-figcap b{color:var(--apm-fg-2)}
.apm-lightbox{
  position:fixed;inset:0;z-index:100;background:rgba(1,7,17,.92);
  display:flex;align-items:center;justify-content:center;padding:32px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.apm-lightbox.open{opacity:1;pointer-events:auto}
.apm-lightbox img{max-width:96vw;max-height:88vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#fff}
.apm-lightbox-close{
  position:absolute;top:20px;right:24px;width:44px;height:44px;border-radius:50%;
  background:var(--apm-surface);border:1px solid var(--apm-border-strong);color:var(--apm-fg);
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.apm-lightbox-close:hover{background:var(--apm-surface-2)}
.apm-lightbox-cap{
  position:absolute;bottom:22px;left:0;right:0;text-align:center;color:var(--apm-muted);font-size:13px;padding:0 32px;
}

/* ---------- Footer ---------- */
.apm-footer{
  position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:16px;
  padding:9px 18px;background:rgba(3,21,45,.92);backdrop-filter:blur(8px);
  border-top:1px solid var(--apm-border);font-size:12.5px;color:var(--apm-muted);
}
.apm-progress{flex:1;height:4px;background:var(--apm-surface-2);border-radius:999px;overflow:hidden}
.apm-progress > span{display:block;height:100%;background:var(--apm-turquoise);transition:width .25s}
.apm-kbds{display:flex;gap:6px;flex-wrap:wrap}
.apm-kbd{
  font-family:var(--apm-mono);font-size:11px;background:var(--apm-surface-2);
  border:1px solid var(--apm-border);border-radius:6px;padding:2px 7px;color:var(--apm-muted);
}
.apm-count{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Cover ---------- */
.apm-cover{
  min-height:calc(100vh - 168px);display:flex;flex-direction:column;justify-content:center;
  max-width:1100px;margin:0 auto;padding:0 24px;
}
.apm-cover .apm-eyebrow{font-size:13px}
.apm-cover h1{font-size:56px;line-height:1.05;margin:6px 0 12px;letter-spacing:-.02em}
.apm-cover .cov-sub{font-size:20px;color:var(--apm-fg-2);max-width:60ch;margin-bottom:28px}
.apm-cover-meta{display:flex;flex-wrap:wrap;gap:32px;margin-top:8px}
.apm-cover-meta .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--apm-muted);margin-bottom:6px}
.apm-cover-meta .val{font-size:14px;color:var(--apm-fg-2)}
.apm-team{display:flex;flex-direction:column;gap:3px}

/* ---------- TOC slide ---------- */
.apm-toc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.apm-toc-card{
  display:flex;gap:12px;align-items:baseline;text-align:left;cursor:pointer;
  background:var(--apm-surface);border:1px solid var(--apm-border);border-radius:10px;
  padding:14px 16px;color:var(--apm-fg-2);transition:border-color .2s,transform .2s;
}
.apm-toc-card:hover{border-color:var(--apm-border-strong);transform:translateY(-2px)}
.apm-toc-card .n{font-variant-numeric:tabular-nums;color:var(--apm-turquoise);font-size:13px;font-weight:600}
.apm-toc-card .t{font-size:14px}
.apm-toc-block-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--apm-muted);margin:20px 0 10px}

/* ---------- Callout ---------- */
.apm-callout{
  border-left:3px solid var(--apm-turquoise);background:var(--apm-surface);
  border-radius:0 10px 10px 0;padding:14px 18px;margin:14px 0;font-size:14px;color:var(--apm-fg-2);
}
.apm-callout.warn{border-left-color:var(--apm-orange)}
.apm-callout b{color:var(--apm-fg)}

/* ---------- Cola (presenter notes) ---------- */
.apm-cola{max-width:900px;margin:0 auto;padding:40px 32px 80px}
.apm-cola h1{font-size:30px;margin:0 0 6px}
.apm-cola .sub{color:var(--apm-muted);margin-bottom:24px}
.apm-cola-nav{position:sticky;top:0;background:rgba(3,21,45,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--apm-border);padding:10px 0;margin-bottom:20px;display:flex;gap:8px;flex-wrap:wrap;z-index:10}
.apm-cola-nav a{font-size:12px;background:var(--apm-surface-2);border:1px solid var(--apm-border);
  border-radius:6px;padding:3px 9px;color:var(--apm-muted)}
.apm-cola-entry{border-bottom:1px solid var(--apm-border);padding:18px 0}
.apm-cola-entry h3{margin:0 0 8px;font-size:18px;color:var(--apm-turquoise)}
.apm-cola-entry .notes{font-size:15px;color:var(--apm-fg-2);line-height:1.65}
.apm-cola-back{display:inline-block;margin-bottom:18px;font-size:13px}

/* ---------- Evidências selecionadas para projeção ---------- */
.apm-proof{min-width:0;background:var(--apm-surface-2);border:1px solid var(--apm-border);border-radius:10px;padding:12px 14px;margin:10px 0}
.apm-proof h4{margin:0 0 7px;color:var(--apm-turquoise);font-size:14px}
.apm-proof pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.45 var(--apm-mono)}
.apm-source{font-size:11px;color:var(--apm-muted);margin-top:7px;overflow-wrap:anywhere}
.apm-source a{text-decoration:underline}
.apm-evidence-slide h1.title{font-size:34px}
.apm-evidence-slide h2.subtitle{margin-bottom:14px}
.apm-evidence-slide .apm-card{padding:14px}
.apm-evidence-slide .apm-callout{padding:10px 14px}
.apm-evidence-slide .apm-figure{min-width:0}
.apm-evidence-slide .apm-figure img{max-height:75px;object-fit:contain}
.apm-evidence-slide .apm-figcap{font-size:11px}
.apm-evidence-slide .apm-grid-2 > div{min-width:0}
.apm-slide:has(.apm-evidence-slide){padding-top:26px;padding-bottom:18px}
.apm-slide:has(.apm-grid-4 .apm-metric){padding-top:26px;padding-bottom:18px}
.apm-slide:has(.apm-grid-4 .apm-metric) h2.subtitle{margin-bottom:16px}
.apm-slide:has(.apm-grid-4 .apm-metric) .apm-table td{padding-top:6px;padding-bottom:6px}
.apm-vector{font:11px/1.4 var(--apm-mono);color:var(--apm-muted);overflow-wrap:anywhere;margin:8px 0}
@media(max-width:900px){.apm-evidence-slide h1.title{font-size:28px}.apm-proof pre{font-size:12px}}
/* ---------- Responsive ---------- */
@media (max-width:900px){
  .apm-topbar{flex-wrap:wrap;gap:8px}
  .apm-brand{flex:1;font-size:12px}
  .apm-brand small{display:none}
  .apm-kbds{display:none}
  .apm-slide{padding:32px 22px 24px}
  .apm-cover h1{font-size:38px}
  .apm-slide h1.title{font-size:32px}
  .apm-grid-2,.apm-grid-3,.apm-grid-4,.apm-toc-grid{grid-template-columns:1fr}
  .apm-nav-arrow{display:none}
  .apm-topbar-title{display:none}
}
@media print{
  .apm-topbar,.apm-footer,.apm-nav-arrow,.apm-sidebar,.apm-backdrop{display:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="apm-lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Imagem ampliada">
  <button class="apm-lightbox-close" id="lbClose" aria-label="Fechar imagem">×</button>
  <img id="lbImg" src="" alt="" />
  <div class="apm-lightbox-cap" id="lbCap"></div>
</div>

/* ================= Helpers de conteúdo ================= */
function fig(key, num, caption){
  return `<button class="apm-figure" onclick="openLightbox('${key}','Figura ${num}. ${caption.replace(/'/g,"\\'")}')">
    <img src="${IMG[key]}" alt="Figura ${num}. ${caption.replace(/"/g,'&quot;')}" loading="lazy" />
    <span class="apm-figcap"><b>Figura ${num}.</b> ${caption}</span>
  </button>`;
}
function sev(kind, text){
  const cls = kind==='crit'?'sev-crit':kind==='high'?'sev-high':'sev-med';
  return `<span class="apm-sev ${cls}"><span class="apm-sev-dot"></span>${text}</span>`;
}

function escapeEvidence(text){
  return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function proof(title, excerpt, sources, note="Trechos selecionados; campos não exibidos omitidos."){
  return '<section class="apm-proof"><h4>'+escapeEvidence(title)+'</h4><pre>'+escapeEvidence(excerpt)+'</pre><div class="apm-source">'+escapeEvidence(note)+'<br>'+sources.map(([label,path])=>'<a href="../evidencias/'+escapeEvidence(path)+'" target="_blank" rel="noopener">'+escapeEvidence(label)+'</a>').join(' · ')+'</div></section>';
}

/* ================= Estado e roteamento ================= */
let idx = 0, tocOpen = false;
const app = document.getElementById("app");
const total = SLIDES.length;

function clamp(i){ return Math.max(0, Math.min(total-1, i)); }

function render(){
  const s = SLIDES[idx];
  app.innerHTML = `
    <div class="apm-topbar">
      <button class="apm-topbtn" onclick="toggleToc()" aria-label="Abrir sumário">☰ Sumário</button>
      <span class="apm-brand">OWASP Juice Shop<small>Seminário</small></span>
      <span class="apm-topbar-title">${s.title}</span>
      <button class="apm-topbtn" onclick="goto(1)" aria-label="Ir ao índice">Índice</button>
      <button class="apm-topbtn" onclick="toggleFs()" id="fsBtn" aria-label="Tela cheia">⤢ Tela cheia</button>
    </div>
    <div class="apm-shell">
      <div class="apm-stage"><div class="apm-slide" id="slide">${s.render()}</div></div>
    </div>
    <button class="apm-nav-arrow prev" onclick="goto(idx-1)" ${idx===0?'disabled':''} aria-label="Slide anterior">‹</button>
    <button class="apm-nav-arrow next" onclick="goto(idx+1)" ${idx===total-1?'disabled':''} aria-label="Próximo slide">›</button>
    <div class="apm-footer">
      <span class="apm-count">Slide ${idx+1} de ${total}</span>
      <div class="apm-progress"><span style="width:${((idx+1)/total)*100}%"></span></div>
      <div class="apm-kbds">
        <span class="apm-kbd">← →</span><span class="apm-kbd">Home/End</span>
        <span class="apm-kbd">F</span><span class="apm-kbd">S</span><span class="apm-kbd">Esc</span>
      </div>
    </div>
    ${renderSidebar()}
  `;
  updateFsLabel();
}

function renderSidebar(){
  let items = "";
  ["A","B","C"].forEach(g=>{
    items += `<div class="apm-group-label">${GROUP_LABELS[g]}</div>`;
    SLIDES.forEach((s,i)=>{
      if(s.group!==g) return;
      const num = String(i+1).padStart(2,"0");
      items += `<button class="apm-toc-item ${i===idx?'active':''}" onclick="goto(${i})" aria-label="Ir para o slide ${i+1}: ${s.title}">
        <span class="apm-toc-num">${num}</span><span>${s.title}</span></button>`;
    });
  });
  return `
    <div class="apm-backdrop ${tocOpen?'open':''}" onclick="toggleToc()"></div>
    <aside class="apm-sidebar ${tocOpen?'open':''}" aria-hidden="${tocOpen?'false':'true'}">
      <div class="apm-sidebar-head"><h2>Sumário</h2><button class="apm-topbtn" onclick="toggleToc()" aria-label="Fechar sumário">×</button></div>
      <div class="apm-sidebar-body">${items}</div>
    </aside>`;
}

function goto(i){
  i = clamp(i);
  idx = i; tocOpen = false;
  history.replaceState(null,"",`#slide-${i+1}`);
  render();
  window.scrollTo(0,0);
}
function toggleToc(){ tocOpen = !tocOpen; render(); }

/* ---------- Fullscreen ---------- */
function toggleFs(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); }
  else { document.exitFullscreen?.(); }
}
function updateFsLabel(){
  const b = document.getElementById("fsBtn");
  if(b) b.textContent = document.fullscreenElement ? "⤡ Sair" : "⤢ Tela cheia";
}
document.addEventListener("fullscreenchange", updateFsLabel);

/* ---------- Lightbox ---------- */
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbCap = document.getElementById("lbCap");
function openLightbox(key, cap){
  lbImg.src = IMG[key]; lbImg.alt = cap; lbCap.textContent = cap;
  lb.classList.add("open");
}
function closeLightbox(){ lb.classList.remove("open"); lbImg.src=""; }
document.getElementById("lbClose").addEventListener("click", closeLightbox);
lb.addEventListener("click", e=>{ if(e.target===lb) closeLightbox(); });
// Esc em fase de captura, fecha o lightbox antes do deck reagir
window.addEventListener("keydown", e=>{
  if(e.key==="Escape" && lb.classList.contains("open")){ e.stopPropagation(); closeLightbox(); }
}, true);

/* ---------- Teclado global ---------- */
window.addEventListener("keydown", e=>{
  const t = e.target;
  if(t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA")) return;
  if(lb.classList.contains("open")){ return; }
  switch(e.key){
    case "ArrowRight": case "ArrowDown": case "PageDown": case " ":
      e.preventDefault(); goto(idx+1); break;
    case "ArrowLeft": case "ArrowUp": case "PageUp":
      e.preventDefault(); goto(idx-1); break;
    case "Home": e.preventDefault(); goto(0); break;
    case "End": e.preventDefault(); goto(total-1); break;
    case "f": case "F": toggleFs(); break;
    case "s": case "S": toggleToc(); break;
    case "Escape": if(tocOpen){ tocOpen=false; render(); } break;
  }
});

/* ---------- Roteamento por hash ---------- */
function route(){
  const h = location.hash;
  const m = h.match(/#slide-(\d+)/);
  if(m){ idx = clamp(parseInt(m[1],10)-1); }
  render();
}
window.addEventListener("hashchange", route);
route();
</script>
